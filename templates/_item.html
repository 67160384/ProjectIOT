<div class="item-row"><label class="item-name">ชื่อสินค้า<input class="form-control" data-field="name" value="{{ item.name or '' }}" maxlength="150" required></label><label>จำนวน<input class="form-control" data-field="quantity" type="number" min="0.001" max="10000" step="0.001" value="{{ item.quantity if item.quantity is defined and item.quantity is not none else '1' }}" required></label><label>ยอดรวมบรรทัด (บาท)<input class="form-control money" data-field="line_total" type="number" min="0" step="0.01" value="{{ item.line_total if item.line_total is defined and item.line_total is not none else '' }}" required></label><label class="item-category">หมวดหมู่<select class="form-select" data-field="category" required><option value="">เลือกหมวดหมู่</option>{% for category in categories %}<option value="{{ category }}" {{ 'selected' if item.category == category else '' }}>{{ category }}</option>{% endfor %}</select></label><button type="button" class="remove-item" aria-label="ลบรายการสินค้า">×</button></div>
